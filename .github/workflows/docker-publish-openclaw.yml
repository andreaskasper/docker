name: Docker Image Openclaw CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * 0' # weekly (Sunday 00:00 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # YYYY-MM-DD (UTC on GitHub runners)
      - name: Set build date tag
        id: builddate
        run: echo "DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Resolve what "openclaw@latest" currently means on npm
      # and normalize date-like versions to safe docker tags
      - name: Resolve OpenClaw version from npm (latest) + normalize
        id: ocv
        shell: bash
        run: |
          set -euo pipefail

          RAW="$(npm view openclaw version)"
          echo "RAW=$RAW" >> $GITHUB_OUTPUT

          # If RAW looks like YYYY.M.D or YYYY.MM.DD etc., normalize to YYYY-MM-DD (zero padded)
          if [[ "$RAW" =~ ^([0-9]{4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            Y="${BASH_REMATCH[1]}"
            M="$(printf '%02d' "${BASH_REMATCH[2]}")"
            D="$(printf '%02d' "${BASH_REMATCH[3]}")"
            NORM="${Y}-${M}-${D}"
          # If RAW already looks like YYYY-MM-DD (or YYYY-M-D), normalize/pad too
          elif [[ "$RAW" =~ ^([0-9]{4})-([0-9]{1,2})-([0-9]{1,2})$ ]]; then
            Y="${BASH_REMATCH[1]}"
            M="$(printf '%02d' "${BASH_REMATCH[2]}")"
            D="$(printf '%02d' "${BASH_REMATCH[3]}")"
            NORM="${Y}-${M}-${D}"
          else
            # Fallback: keep it, but make it docker-tag-safe just in case
            # (replace anything not [A-Za-z0-9_.-] with '-')
            NORM="$(echo "$RAW" | sed -E 's/[^A-Za-z0-9_.-]+/-/g')"
            # Year/year-month only if it starts with 4 digits
            Y="$(echo "$RAW" | sed -nE 's/^([0-9]{4}).*/\1/p')"
          fi

          # Derive YEAR and YEAR_MONTH if NORM begins with YYYY-MM
          if [[ "$NORM" =~ ^([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
            YEAR="${BASH_REMATCH[1]}"
            YEAR_MONTH="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          elif [[ "$RAW" =~ ^([0-9]{4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            YEAR="${BASH_REMATCH[1]}"
            YEAR_MONTH="${BASH_REMATCH[1]}-$(printf '%02d' "${BASH_REMATCH[2]}")"
          else
            YEAR="${Y:-}"
            YEAR_MONTH=""
          fi

          echo "VERSION=$RAW" >> $GITHUB_OUTPUT
          echo "TAG=$NORM" >> $GITHUB_OUTPUT
          echo "YEAR=$YEAR" >> $GITHUB_OUTPUT
          echo "YEAR_MONTH=$YEAR_MONTH" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: andreaskasper
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build tags safely (skip empty YEAR / YEAR_MONTH)
      - name: Build tag list (skip empty)
        id: taglist
        shell: bash
        run: |
          set -euo pipefail

          TAGS=()
          TAGS+=("andreaskasper/openclaw:latest")
          TAGS+=("andreaskasper/openclaw:${{ steps.builddate.outputs.DATE }}")
          TAGS+=("andreaskasper/openclaw:${{ steps.ocv.outputs.TAG }}")
          TAGS+=("andreaskasper/openclaw:${{ github.sha }}")

          if [[ -n "${{ steps.ocv.outputs.YEAR }}" ]]; then
            TAGS+=("andreaskasper/openclaw:${{ steps.ocv.outputs.YEAR }}")
          fi

          if [[ -n "${{ steps.ocv.outputs.YEAR_MONTH }}" ]]; then
            TAGS+=("andreaskasper/openclaw:${{ steps.ocv.outputs.YEAR_MONTH }}")
          fi

          printf "TAGS<<EOF\n%s\nEOF\n" "$(printf "%s\n" "${TAGS[@]}")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: openclaw/.
          push: true
          # Dockerfile must support:
          #   ARG OPENCLAW_VERSION=latest
          #   RUN npm install -g openclaw@${OPENCLAW_VERSION}
          build-args: |
            OPENCLAW_VERSION=${{ steps.ocv.outputs.VERSION }}
          tags: ${{ steps.taglist.outputs.TAGS }}
